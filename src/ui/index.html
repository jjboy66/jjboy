<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionGuard-Lite Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f5f8ff; color: #223; }
    .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 3px 10px #00000012; }
    textarea { width: 100%; min-height: 120px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; background: #247cff; color: #fff; cursor: pointer; }
    pre { background: #0e1d2f; color: #bce4ff; padding: 12px; border-radius: 8px; overflow: auto; }
  </style>
</head>
<body>
  <h1>VisionGuard-Lite 看板</h1>

  <div class="card">
    <h3>推理请求</h3>
    <p>粘贴图片 Base64 后调用 /detect 接口。</p>
    <textarea id="imgB64" placeholder="image base64..."></textarea>
    <div style="margin-top:10px;"><button onclick="runDetect()">执行检测</button></div>
  </div>

  <div class="card">
    <h3>结果</h3>
    <pre id="result">{}</pre>
  </div>

  <script>
    async function runDetect() {
      const image_base64 = document.getElementById('imgB64').value.trim();
      const resp = await fetch('/detect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image_base64, source_id: 'dashboard-camera', frame_index: Date.now() % 1000 })
      });
      const data = await resp.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
