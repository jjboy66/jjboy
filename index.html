<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>共享对话记录</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6fb;
      --panel: #ffffff;
      --line: #d8deea;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.55rem;
    }

    .desc {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .notice {
      margin: 0 0 12px;
      color: var(--danger);
      font-size: 0.9rem;
      min-height: 1.25rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.05);
    }

    .composer {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    input, textarea, button {
      font: inherit;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      color: #111827;
    }

    textarea {
      resize: vertical;
      min-height: 84px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
    }

    button.delete {
      background: var(--danger);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    li {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fff;
    }

    .meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>共享对话记录</h1>
    <p class="desc">任何访问者都可以新增、编辑和删除记录（实时共享）。</p>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>

    <section class="panel composer" aria-label="新增对话">
      <input id="newName" type="text" maxlength="40" placeholder="你的名字（可选）" />
      <textarea id="newText" maxlength="2000" placeholder="输入要记录的对话内容"></textarea>
      <div class="actions">
        <button id="addBtn" type="button">添加记录</button>
      </div>
    </section>

    <section class="panel" aria-label="对话列表">
      <ul id="list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <script>
    (function () {
      const RECORD_KEY = "shared-dialogue-record";
      const configuredPeer = new URLSearchParams(window.location.search).get("peer");
      const gun = window.GUN
        ? (configuredPeer ? window.GUN({ peers: [configuredPeer] }) : window.GUN())
        : null;

      const listEl = document.getElementById("list");
      const newNameEl = document.getElementById("newName");
      const newTextEl = document.getElementById("newText");
      const noticeEl = document.getElementById("notice");
      const addBtn = document.getElementById("addBtn");
      const entries = new Map();

      function setNotice(message) {
        noticeEl.textContent = message || "";
      }

      function createId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return String(Date.now()) + "-" + Math.random().toString(36).slice(2, 10);
      }

      function formatTime(ts) {
        if (!ts) return "";
        const d = new Date(ts);
        return Number.isNaN(d.getTime()) ? "" : d.toLocaleString();
      }

      function createCard(id, data) {
        const li = document.createElement("li");
        li.dataset.id = id;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `ID: ${id} ｜ 更新时间: ${formatTime(data.updatedAt)}`;

        const nameInput = document.createElement("input");
        nameInput.className = "edit-name";
        nameInput.maxLength = 40;
        nameInput.value = data.name || "";
        nameInput.placeholder = "名字（可选）";

        const textArea = document.createElement("textarea");
        textArea.className = "edit-text";
        textArea.maxLength = 2000;
        textArea.value = data.text || "";
        textArea.placeholder = "对话内容";

        const actions = document.createElement("div");
        actions.className = "actions";

        const saveBtn = document.createElement("button");
        saveBtn.type = "button";
        saveBtn.className = "save";
        saveBtn.textContent = "保存";

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "delete";
        deleteBtn.textContent = "删除";

        actions.append(saveBtn, deleteBtn);
        li.append(meta, nameInput, textArea, actions);
        return li;
      }

      function render() {
        const rows = Array.from(entries.entries())
          .map(([id, data]) => ({ id, data }))
          .filter(item => item.data && !item.data.deleted)
          .sort((a, b) => (b.data.updatedAt || 0) - (a.data.updatedAt || 0));

        listEl.innerHTML = "";
        const frag = document.createDocumentFragment();

        rows.forEach(({ id, data }) => {
          frag.appendChild(createCard(id, data));
        });

        if (!rows.length) {
          const empty = document.createElement("li");
          empty.className = "meta";
          empty.textContent = "暂无记录，先添加一条吧。";
          frag.appendChild(empty);
        }

        listEl.appendChild(frag);
      }

      function saveEntry(id, name, text) {
        if (!gun) {
          setNotice("实时服务不可用，暂时无法保存。");
          return;
        }
        if (!text.trim()) return;
        gun.get(RECORD_KEY).get(id).put({
          name: (name || "").trim(),
          text: text.trim(),
          updatedAt: Date.now(),
          deleted: false
        });
      }

      function deleteEntry(id) {
        if (!gun) {
          setNotice("实时服务不可用，暂时无法删除。");
          return;
        }
        gun.get(RECORD_KEY).get(id).put({
          deleted: true,
          updatedAt: Date.now()
        });
      }

      addBtn.addEventListener("click", function () {
        const text = newTextEl.value.trim();
        if (!text) {
          setNotice("请先输入对话内容。");
          return;
        }
        setNotice("");
        const id = createId();
        saveEntry(id, newNameEl.value, text);
        newTextEl.value = "";
      });

      listEl.addEventListener("click", function (event) {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;

        const li = target.closest("li");
        if (!li || !li.dataset.id) return;
        const id = li.dataset.id;

        if (target.classList.contains("save")) {
          const name = li.querySelector(".edit-name");
          const text = li.querySelector(".edit-text");
          saveEntry(id, name?.value ?? "", text?.value ?? "");
        }

        if (target.classList.contains("delete")) {
          deleteEntry(id);
        }
      });

      if (!gun) {
        setNotice("实时服务加载失败，请检查网络后刷新页面。");
        const err = document.createElement("li");
        err.className = "meta";
        err.textContent = "实时服务加载失败，请检查网络后刷新页面。";
        listEl.appendChild(err);
        return;
      }

      gun.get(RECORD_KEY).map().on(function (data, key) {
        if (!data || key === "_") return;
        if (data.deleted) {
          entries.delete(key);
        } else {
          entries.set(key, {
            name: typeof data.name === "string" ? data.name : "",
            text: typeof data.text === "string" ? data.text : "",
            updatedAt: typeof data.updatedAt === "number" ? data.updatedAt : Date.now(),
            deleted: !!data.deleted
          });
        }
        render();
      });
    })();
  </script>
</body>
</html>
