<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑洞可视化 - 事件视界</title>
    <style>
        :root {
            --bg: #000010;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            cursor: crosshair;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .title {
            font-size: clamp(1.2rem, 2.5vw, 1.6rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            color: rgba(255, 210, 140, 0.85);
            text-shadow: 0 0 30px rgba(255, 150, 40, 0.5), 0 0 60px rgba(255, 120, 20, 0.3);
            transition: all 0.8s ease;
        }

        .subtitle {
            font-size: clamp(0.65rem, 1.2vw, 0.78rem);
            font-weight: 200;
            letter-spacing: 0.25em;
            color: rgba(200, 170, 140, 0.6);
            text-shadow: 0 0 15px rgba(200, 130, 60, 0.3);
        }

        .hint {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: rgba(180, 150, 120, 0.4);
            margin-top: 12px;
            animation: hintPulse 3s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%,
            100% {
                opacity: 0.35;
            }
            50% {
                opacity: 0.7;
            }
        }

        @media (max-width: 600px) {
            .overlay {
                bottom: 28px;
                gap: 4px;
            }
            .hint {
                font-size: 0.6rem;
                margin-top: 6px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="overlay">
        <div class="title">事 件 视 界</div>
        <div class="subtitle">E V E N T &nbsp; H O R I Z O N</div>
        <div class="hint">✦ 移动鼠标改变视角 ✦</div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            let width, height, centerX, centerY, scale;
            let dpr = Math.min(window.devicePixelRatio || 1, 2); // 限制像素比以保证性能
            let mouseX = 0,
                mouseY = 0;
            let targetMouseX = 0,
                targetMouseY = 0;
            let time = 0;
            let animationId;

            // 黑洞参数
            const blackHoleBaseRadius = 0.12; // 相对于画布短边的比例
            let shadowRadius, photonRingRadius, innerDiskRadius, outerDiskRadius;
            let tiltAngle = Math.PI / 3; // 吸积盘倾斜角（约60度）
            let baseTiltAngle = Math.PI / 3;

            // 粒子系统
            const MAX_PARTICLES = 180;
            let particles = [];
            let particlePool = [];

            // 星空
            const MAX_STARS = 600;
            let stars = [];
            let twinkleStars = [];

            // 热斑
            const MAX_HOTSPOTS = 25;
            let hotspots = [];

            // 透镜弧线粒子
            const MAX_ARC_POINTS = 120;
            let arcGlowPoints = [];

            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);

                centerX = width / 2;
                centerY = height / 2;
                scale = Math.min(width, height);
                shadowRadius = blackHoleBaseRadius * scale;
                photonRingRadius = shadowRadius * 1.04;
                innerDiskRadius = shadowRadius * 1.08;
                outerDiskRadius = shadowRadius * 4.5;

                // 重新生成星空
                generateStars();
                // 重新生成热斑
                generateHotspots();
                // 重新生成弧光点
                generateArcGlowPoints();
                // 重置粒子
                initParticles();
            }

            function generateStars() {
                stars = [];
                twinkleStars = [];
                const count = Math.floor(MAX_STARS * Math.min(width * height / 800000, 1.2));
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * Math.max(width, height) * 0.8;
                    const sx = centerX + Math.cos(angle) * dist;
                    const sy = centerY + Math.sin(angle) * dist;
                    // 排除黑洞附近区域
                    const dx = sx - centerX;
                    const dy = sy - centerY;
                    const distFromCenter = Math.sqrt(dx * dx + dy * dy);
                    if (distFromCenter < shadowRadius * 1.6) continue;

                    const brightness = 0.25 + Math.random() * 0.75;
                    const size = Math.random() * 1.6 + 0.3;
                    const colorTemp = Math.random();
                    let starColor;
                    if (colorTemp < 0.15) {
                        starColor = { r: 170, g: 190, b: 255 }; // 蓝白星
                    } else if (colorTemp < 0.35) {
                        starColor = { r: 255, g: 245, b: 230 }; // 暖白星
                    } else if (colorTemp < 0.6) {
                        starColor = { r: 255, g: 220, b: 170 }; // 淡金星
                    } else {
                        starColor = { r: 255, g: 190, b: 140 }; // 橙星
                    }

                    stars.push({
                        x: sx,
                        y: sy,
                        brightness,
                        size,
                        color: starColor,
                        twinkleSpeed: 0.3 + Math.random() * 2.5,
                        twinkleOffset: Math.random() * Math.PI * 2,
                        twinkleAmp: Math.random() * 0.45,
                    });

                    if (Math.random() < 0.25) {
                        twinkleStars.push(stars[stars.length - 1]);
                    }
                }
            }

            function generateHotspots() {
                hotspots = [];
                for (let i = 0; i < MAX_HOTSPOTS; i++) {
                    hotspots.push({
                        angle: Math.random() * Math.PI * 2,
                        radius: innerDiskRadius + Math.random() * (outerDiskRadius - innerDiskRadius),
                        brightness: 0.3 + Math.random() * 0.7,
                        size: 0.3 + Math.random() * 1.8,
                        lifetime: 1.5 + Math.random() * 5,
                        age: Math.random() * 5,
                        driftSpeed: (Math.random() - 0.5) * 0.3,
                    });
                }
            }

            function generateArcGlowPoints() {
                arcGlowPoints = [];
                const count = MAX_ARC_POINTS;
                for (let i = 0; i < count; i++) {
                    const paramAngle = (i / count) * Math.PI * 2;
                    arcGlowPoints.push({
                        baseAngle: paramAngle,
                        radius: shadowRadius * (0.95 + Math.random() * 0.25),
                        brightness: 0.3 + Math.random() * 0.7,
                        phase: Math.random() * Math.PI * 2,
                        pulseSpeed: 1.5 + Math.random() * 3,
                    });
                }
            }

            function initParticles() {
                particles = [];
                const count = Math.min(MAX_PARTICLES, Math.floor(width * height / 5000));
                for (let i = 0; i < count; i++) {
                    particles.push(createParticle(true));
                }
            }

            function createParticle(randomStart = false) {
                const startRadius = randomStart ?
                    innerDiskRadius + Math.random() * (outerDiskRadius - innerDiskRadius) :
                    outerDiskRadius - Math.random() * (outerDiskRadius - innerDiskRadius) * 0.2;
                const angle = Math.random() * Math.PI * 2;
                const lifetime = 2 + Math.random() * 8;
                return {
                    angle,
                    radius: startRadius,
                    startRadius,
                    lifetime,
                    age: Math.random() * lifetime,
                    speed: 0.6 + Math.random() * 2.5,
                    brightness: 0.35 + Math.random() * 0.65,
                    size: 0.4 + Math.random() * 1.5,
                    verticalOffset: (Math.random() - 0.5) * shadowRadius * 0.4,
                };
            }

            function updateParticle(p, dt) {
                p.age += dt;
                const progress = p.age / p.lifetime;
                if (progress >= 1) return false;

                // 螺旋向内，越靠近中心越快
                const radialSpeed = p.speed * (1 + 3 * (1 - p.radius / p.startRadius));
                p.radius -= radialSpeed * dt * (shadowRadius * 0.08);
                p.angle += dt * (2.5 + 8 * (shadowRadius / Math.max(p.radius, 0.01))) * p.speed;

                // 粒子在靠近黑洞时变得更亮
                const closenessToShadow = Math.max(0, 1 - (p.radius - shadowRadius * 0.7) / (shadowRadius * 0.6));
                p.currentBrightness = p.brightness * (1 + closenessToShadow * 3);

                return p.radius > shadowRadius * 0.55;
            }

            function spawnParticleIfNeeded() {
                const activeCount = particles.filter(p => p.age < p.lifetime && p.radius > shadowRadius * 0.55)
                    .length;
                const targetCount = Math.min(MAX_PARTICLES, Math.floor(width * height / 5000));
                if (activeCount < targetCount && Math.random() < 0.6) {
                    particles.push(createParticle(false));
                }
                // 清理死粒子
                if (particles.length > targetCount * 1.5) {
                    particles = particles.filter(p => p.age < p.lifetime && p.radius > shadowRadius * 0.55);
                    while (particles.length < targetCount * 0.7) {
                        particles.push(createParticle(true));
                    }
                }
            }

            function drawStarfield(t) {
                // 绘制所有星星
                for (const star of stars) {
                    let brightness = star.brightness;
                    if (star.twinkleAmp > 0.05) {
                        const twinkle = Math.sin(t * star.twinkleSpeed + star.twinkleOffset) * 0.5 + 0.5;
                        brightness += twinkle * star.twinkleAmp;
                        brightness = Math.max(0.1, Math.min(1, brightness));
                    }
                    const alpha = brightness * 0.9;
                    const { r, g, b } = star.color;
                    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                    ctx.beginPath();
                    const sx = star.x;
                    const sy = star.y;
                    ctx.arc(sx, sy, star.size * 0.7, 0, Math.PI * 2);
                    ctx.fill();

                    // 亮星加光晕
                    if (brightness > 0.7 && star.size > 1.0) {
                        const glowAlpha = alpha * 0.25;
                        ctx.fillStyle = `rgba(${r},${g},${b},${glowAlpha})`;
                        ctx.beginPath();
                        ctx.arc(sx, sy, star.size * 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            function drawStarLensingDistortions(t) {
                // 在黑洞周围绘制被引力透镜扭曲的星光弧线
                const arcCount = 8;
                for (let i = 0; i < arcCount; i++) {
                    const arcAngle = (i / arcCount) * Math.PI * 2 + t * 0.15;
                    const arcDist = shadowRadius * (1.3 + Math.random() * 0.05);
                    const arcLength = 0.3 + Math.random() * 0.5;
                    const ax = centerX + Math.cos(arcAngle) * arcDist;
                    const ay = centerY + Math.sin(arcAngle) * arcDist;

                    const brightness = 0.15 + Math.sin(t * 1.8 + i) * 0.1;
                    ctx.strokeStyle = `rgba(180,200,255,${brightness})`;
                    ctx.lineWidth = 0.5 + Math.random() * 0.4;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, arcDist, arcAngle - arcLength / 2, arcAngle + arcLength / 2);
                    ctx.stroke();
                }
            }

            function drawAccretionDisk(t) {
                ctx.save();
                ctx.translate(centerX, centerY);

                // 倾斜吸积盘
                const cosTilt = Math.cos(tiltAngle);
                const sinTilt = Math.sin(tiltAngle);

                // 盘面旋转
                const diskRotation = t * 0.7;

                // 使用clip来限制在椭圆内的绘制
                // 先绘制盘面的主体发光
                const diskGradient = ctx.createRadialGradient(0, 0, innerDiskRadius * 0.6, 0, 0, outerDiskRadius);
                diskGradient.addColorStop(0, 'rgba(255,240,220,0.95)');
                diskGradient.addColorStop(0.08, 'rgba(255,210,150,0.9)');
                diskGradient.addColorStop(0.2, 'rgba(255,170,80,0.8)');
                diskGradient.addColorStop(0.4, 'rgba(255,120,35,0.6)');
                diskGradient.addColorStop(0.65, 'rgba(200,60,15,0.35)');
                diskGradient.addColorStop(0.85, 'rgba(120,30,8,0.15)');
                diskGradient.addColorStop(1, 'rgba(60,15,4,0)');

                ctx.save();
                ctx.scale(1, cosTilt);
                ctx.rotate(diskRotation);

                // 绘制盘面主体
                ctx.fillStyle = diskGradient;
                ctx.beginPath();
                ctx.arc(0, 0, outerDiskRadius, 0, Math.PI * 2);
                ctx.fill();

                // 绘制盘面纹理环
                for (let ring = 0; ring < 12; ring++) {
                    const r = innerDiskRadius + (ring / 12) * (outerDiskRadius - innerDiskRadius);
                    const ringAlpha = 0.06 + Math.abs(Math.sin(ring * 1.3 + t * 0.5)) * 0.08;
                    const ringWidth = 2 + (ring / 12) * 8;
                    ctx.strokeStyle = `rgba(255,200,140,${ringAlpha})`;
                    ctx.lineWidth = ringWidth;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // 绘制热斑
                for (const hs of hotspots) {
                    const hsAngle = hs.angle + diskRotation + hs.driftSpeed * t;
                    const hsX = Math.cos(hsAngle) * hs.radius;
                    const hsY = Math.sin(hsAngle) * hs.radius;
                    const hsAlpha = hs.brightness * (0.5 + 0.5 * Math.sin(t * 2.3 + hs.age));
                    const hsGrad = ctx.createRadialGradient(hsX, hsY, 0, hsX, hsY, hs.size * shadowRadius * 0.25);
                    hsGrad.addColorStop(0, `rgba(255,255,220,${hsAlpha})`);
                    hsGrad.addColorStop(0.5, `rgba(255,200,100,${hsAlpha * 0.6})`);
                    hsGrad.addColorStop(1, `rgba(255,100,30,0)`);
                    ctx.fillStyle = hsGrad;
                    ctx.beginPath();
                    ctx.arc(hsX, hsY, hs.size * shadowRadius * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 多普勒效应——一侧更亮
                const dopplerGrad = ctx.createRadialGradient(0, 0, innerDiskRadius * 0.7, 0, 0, outerDiskRadius *
                    0.95);
                dopplerGrad.addColorStop(0, 'rgba(255,255,255,0)');
                dopplerGrad.addColorStop(0.3, 'rgba(255,255,240,0)');
                dopplerGrad.addColorStop(0.7, 'rgba(255,200,100,0)');
                dopplerGrad.addColorStop(1, 'rgba(255,80,20,0)');
                ctx.fillStyle = dopplerGrad;
                ctx.beginPath();
                // 在盘面旋转方向前方加亮
                const brightAngle = diskRotation + Math.PI / 2;
                const bx = Math.cos(brightAngle) * outerDiskRadius * 0.5;
                const by = Math.sin(brightAngle) * outerDiskRadius * 0.5;
                ctx.arc(bx, by, outerDiskRadius * 0.55, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore(); // 恢复倾斜+旋转

                // 绘制引力透镜弧——在黑洞上方（盘面后方被弯曲的光线）
                drawLensingArcs(t, cosTilt, sinTilt);

                ctx.restore();
            }

            function drawLensingArcs(t, cosTilt, sinTilt) {
                // 在黑洞阴影上方绘制透镜化的盘面光线
                const arcTopY = -shadowRadius * (0.55 + cosTilt * 0.25);
                const arcBottomY = shadowRadius * (0.55 + cosTilt * 0.25);

                // 上方弧线（盘面后方光线弯曲到上方）
                for (let layer = 0; layer < 5; layer++) {
                    const arcRadius = shadowRadius * (0.75 + layer * 0.06);
                    const arcY = arcTopY - layer * shadowRadius * 0.04;
                    const alpha = (0.7 - layer * 0.12) * (0.5 + 0.5 * Math.sin(t * 2 + layer));
                    const arcSpan = Math.PI * (0.5 + layer * 0.08);

                    ctx.strokeStyle = `rgba(255,200,130,${alpha})`;
                    ctx.lineWidth = 1.8 + layer * 0.6;
                    ctx.beginPath();
                    ctx.ellipse(centerX, centerY + arcY * 0.15, arcRadius, arcRadius * 0.7, 0,
                        -Math.PI / 2 - arcSpan / 2, -Math.PI / 2 + arcSpan / 2);
                    ctx.stroke();

                    // 更亮的内层
                    if (layer < 2) {
                        ctx.strokeStyle = `rgba(255,230,190,${alpha * 1.3})`;
                        ctx.lineWidth = 1.2 + layer * 0.4;
                        ctx.beginPath();
                        ctx.ellipse(centerX, centerY + arcY * 0.15, arcRadius * 0.85, arcRadius * 0.6, 0,
                            -Math.PI / 2 - arcSpan * 0.6 / 2, -Math.PI / 2 + arcSpan * 0.6 / 2);
                        ctx.stroke();
                    }
                }

                // 下方弧线（较暗，因为远离观测者的盘面部分）
                for (let layer = 0; layer < 3; layer++) {
                    const arcRadius = shadowRadius * (0.8 + layer * 0.05);
                    const arcY = arcBottomY + layer * shadowRadius * 0.03;
                    const alpha = (0.35 - layer * 0.1) * (0.5 + 0.5 * Math.cos(t * 1.7 + layer));
                    const arcSpan = Math.PI * (0.35 + layer * 0.06);

                    ctx.strokeStyle = `rgba(255,160,100,${alpha})`;
                    ctx.lineWidth = 1.2 + layer * 0.5;
                    ctx.beginPath();
                    ctx.ellipse(centerX, centerY + arcY * 0.12, arcRadius, arcRadius * 0.65, 0,
                        Math.PI / 2 - arcSpan / 2, Math.PI / 2 + arcSpan / 2);
                    ctx.stroke();
                }
            }

            function drawBlackHoleShadow(t) {
                // 光子环——紧贴阴影边缘的亮环
                const glowLayers = 6;
                for (let i = glowLayers; i >= 0; i--) {
                    const radius = shadowRadius * (0.94 + i * 0.015);
                    const alpha = (0.9 - i * 0.14) * (0.85 + 0.15 * Math.sin(t * 3.5 + i));
                    const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.92, centerX, centerY, radius *
                        1.08);
                    gradient.addColorStop(0, `rgba(255,220,170,${alpha})`);
                    gradient.addColorStop(0.5, `rgba(255,180,100,${alpha * 0.7})`);
                    gradient.addColorStop(1, `rgba(255,100,30,0)`);
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius * 1.08, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 黑洞阴影主体
                const shadowGrad = ctx.createRadialGradient(centerX, centerY, shadowRadius * 0.75, centerX, centerY,
                    shadowRadius * 1.02);
                shadowGrad.addColorStop(0, 'rgba(0,0,2,1)');
                shadowGrad.addColorStop(0.85, 'rgba(2,1,5,0.95)');
                shadowGrad.addColorStop(0.95, 'rgba(8,4,15,0.55)');
                shadowGrad.addColorStop(1, 'rgba(20,8,25,0)');
                ctx.fillStyle = shadowGrad;
                ctx.beginPath();
                ctx.arc(centerX, centerY, shadowRadius, 0, Math.PI * 2);
                ctx.fill();

                // 事件视界的绝对黑色核心
                const innerShadow = ctx.createRadialGradient(centerX, centerY, shadowRadius * 0.55, centerX, centerY,
                    shadowRadius * 0.82);
                innerShadow.addColorStop(0, 'rgba(0,0,0,1)');
                innerShadow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = innerShadow;
                ctx.beginPath();
                ctx.arc(centerX, centerY, shadowRadius * 0.8, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawPhotonRing(t) {
                // 精细的光子环
                const ringAlpha = 0.55 + 0.2 * Math.sin(t * 4.2);
                ctx.strokeStyle = `rgba(255,235,200,${ringAlpha})`;
                ctx.lineWidth = 1.0;
                ctx.shadowColor = 'rgba(255,200,120,0.8)';
                ctx.shadowBlur = 6 + 3 * Math.sin(t * 3);
                ctx.beginPath();
                ctx.arc(centerX, centerY, photonRingRadius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // 外层微弱的次级光子环
                const ring2Alpha = 0.15 + 0.08 * Math.cos(t * 3.5);
                ctx.strokeStyle = `rgba(255,180,130,${ring2Alpha})`;
                ctx.lineWidth = 0.6;
                ctx.setLineDash([3, 8]);
                ctx.lineDashOffset = t * 20;
                ctx.beginPath();
                ctx.arc(centerX, centerY, photonRingRadius * 1.15, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function drawGlow(t) {
                // 大面积柔和光晕
                const glowGrad = ctx.createRadialGradient(centerX, centerY, shadowRadius * 0.9, centerX, centerY,
                    shadowRadius * 3.5);
                glowGrad.addColorStop(0, 'rgba(255,150,50,0.12)');
                glowGrad.addColorStop(0.3, 'rgba(255,100,30,0.06)');
                glowGrad.addColorStop(0.6, 'rgba(200,50,15,0.02)');
                glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(centerX, centerY, shadowRadius * 3.5, 0, Math.PI * 2);
                ctx.fill();

                // 内层辉光
                const innerGlow = ctx.createRadialGradient(centerX, centerY, shadowRadius * 0.85, centerX, centerY,
                    shadowRadius * 1.6);
                innerGlow.addColorStop(0, 'rgba(255,200,120,0.18)');
                innerGlow.addColorStop(0.5, 'rgba(255,140,60,0.07)');
                innerGlow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = innerGlow;
                ctx.beginPath();
                ctx.arc(centerX, centerY, shadowRadius * 1.6, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawParticles(t) {
                const cosTilt = Math.cos(tiltAngle);
                for (const p of particles) {
                    if (p.age >= p.lifetime || p.radius <= shadowRadius * 0.55) continue;

                    const progress = p.age / p.lifetime;
                    const px = centerX + Math.cos(p.angle) * p.radius;
                    const py = centerY + Math.sin(p.angle) * p.radius * cosTilt + p.verticalOffset;

                    // 检查是否在黑洞阴影内
                    const dx = px - centerX;
                    const dy = py - centerY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < shadowRadius * 0.7) continue;

                    const alpha = p.currentBrightness || p.brightness;
                    // 颜色随温度变化：远处红，近处白/蓝
                    let r, g, b;
                    const tempFactor = Math.max(0, 1 - (p.radius - innerDiskRadius) / (outerDiskRadius -
                        innerDiskRadius));
                    if (tempFactor > 0.6) {
                        // 内侧高温：白到蓝白
                        r = 255;
                        g = 220 + tempFactor * 35;
                        b = 180 + tempFactor * 75;
                    } else if (tempFactor > 0.3) {
                        // 中部：黄到橙
                        r = 255;
                        g = 150 + tempFactor * 70;
                        b = 60 + tempFactor * 120;
                    } else {
                        // 外侧：橙到红
                        r = 220 + tempFactor * 35;
                        g = 70 + tempFactor * 80;
                        b = 15 + tempFactor * 45;
                    }

                    const size = p.size * (1 + tempFactor * 1.5);
                    ctx.fillStyle = `rgba(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)},${alpha})`;
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();

                    // 亮粒子加光晕
                    if (tempFactor > 0.55 && alpha > 0.5) {
                        const glowAlpha = alpha * 0.35;
                        ctx.fillStyle = `rgba(255,240,210,${glowAlpha})`;
                        ctx.beginPath();
                        ctx.arc(px, py, size * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            function drawJets(t) {
                // 微弱喷流——垂直于吸积盘平面
                const cosTilt = Math.cos(tiltAngle);
                const sinTilt = Math.sin(tiltAngle);
                const jetLength = shadowRadius * 3.5;
                const jetWidth = shadowRadius * 0.25;

                // 上方喷流
                for (let j = 0; j < 2; j++) {
                    const direction = j === 0 ? -1 : 1;
                    const jetAlpha = 0.04 + 0.02 * Math.sin(t * 1.5 + j);

                    const jetGrad = ctx.createLinearGradient(
                        centerX, centerY,
                        centerX + sinTilt * jetLength * direction * 0.3,
                        centerY - cosTilt * jetLength * direction
                    );
                    jetGrad.addColorStop(0, `rgba(180,200,255,${jetAlpha * 2})`);
                    jetGrad.addColorStop(0.3, `rgba(140,170,240,${jetAlpha})`);
                    jetGrad.addColorStop(1, 'rgba(100,140,220,0)');

                    ctx.fillStyle = jetGrad;
                    ctx.beginPath();
                    const jx = centerX + sinTilt * jetLength * direction * 0.3;
                    const jy = centerY - cosTilt * jetLength * direction;
                    const perpX = -cosTilt * jetWidth;
                    const perpY = -sinTilt * jetWidth * 0.3;
                    ctx.moveTo(centerX - perpX, centerY - perpY);
                    ctx.lineTo(centerX + perpX, centerY + perpY);
                    ctx.lineTo(jx + perpX * 1.5, jy + perpY * 1.5);
                    ctx.lineTo(jx - perpX * 1.5, jy - perpY * 1.5);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            function updateHotspots(t, dt) {
                for (const hs of hotspots) {
                    hs.age += dt;
                    if (hs.age > hs.lifetime) {
                        hs.age = 0;
                        hs.angle = Math.random() * Math.PI * 2;
                        hs.radius = innerDiskRadius + Math.random() * (outerDiskRadius - innerDiskRadius);
                        hs.brightness = 0.3 + Math.random() * 0.7;
                        hs.driftSpeed = (Math.random() - 0.5) * 0.3;
                    }
                }
            }

            function render(timestamp) {
                time = timestamp * 0.001;
                const dt = Math.min(0.1, 1 / 60); // 防止大帧跳跃

                // 平滑鼠标跟踪
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                // 根据鼠标微调倾斜角度
                const tiltOffset = mouseY * 0.15;
                tiltAngle = baseTiltAngle + tiltOffset;

                // 根据鼠标微调中心偏移（视差效果）
                const parallaxX = mouseX * shadowRadius * 0.12;
                const parallaxY = mouseY * shadowRadius * 0.12;
                const origCenterX = centerX;
                const origCenterY = centerY;
                centerX = width / 2 + parallaxX;
                centerY = height / 2 + parallaxY;

                // 清除画布
                ctx.clearRect(0, 0, width, height);

                // 背景深空
                const bgGrad = ctx.createRadialGradient(centerX, centerY, shadowRadius, centerX, centerY, Math.max(width,
                    height));
                bgGrad.addColorStop(0, '#030310');
                bgGrad.addColorStop(0.25, '#020210');
                bgGrad.addColorStop(0.7, '#010108');
                bgGrad.addColorStop(1, '#000006');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, width, height);

                // 绘制顺序
                drawStarfield(time);
                drawStarLensingDistortions(time);
                drawJets(time);
                drawAccretionDisk(time);
                drawGlow(time);
                drawBlackHoleShadow(time);
                drawPhotonRing(time);
                drawParticles(time);

                // 更新
                updateHotspots(time, dt);
                spawnParticleIfNeeded();

                // 更新粒子
                for (let i = particles.length - 1; i >= 0; i--) {
                    const alive = updateParticle(particles[i], dt);
                    if (!alive) {
                        particles[i] = createParticle(true);
                    }
                }

                // 恢复中心坐标
                centerX = origCenterX;
                centerY = origCenterY;

                animationId = requestAnimationFrame(render);
            }

            function handleMouseMove(e) {
                targetMouseX = (e.clientX - width / 2) / (width / 2);
                targetMouseY = (e.clientY - height / 2) / (height / 2);
                // 限制范围
                targetMouseX = Math.max(-1, Math.min(1, targetMouseX));
                targetMouseY = Math.max(-1, Math.min(1, targetMouseY));
            }

            function handleTouchMove(e) {
                if (e.touches.length > 0) {
                    targetMouseX = (e.touches[0].clientX - width / 2) / (width / 2);
                    targetMouseY = (e.touches[0].clientY - height / 2) / (height / 2);
                    targetMouseX = Math.max(-1, Math.min(1, targetMouseX));
                    targetMouseY = Math.max(-1, Math.min(1, targetMouseY));
                }
            }

            function handleResize() {
                resizeCanvas();
            }

            function init() {
                resizeCanvas();
                window.addEventListener('resize', handleResize);
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('touchmove', handleTouchMove, { passive: true });

                // 初始粒子
                initParticles();

                // 开始渲染循环
                animationId = requestAnimationFrame(render);
            }

            function cleanup() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                window.removeEventListener('resize', handleResize);
                window.removeEventListener('mousemove', handleMouseMove);
                window.removeEventListener('touchmove', handleTouchMove);
            }

            // 页面可见性处理——节省资源
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                } else {
                    if (!animationId) {
                        animationId = requestAnimationFrame(render);
                    }
                }
            });

            // 启动
            init();

            // 清理（SPA场景）
            window.addEventListener('beforeunload', cleanup);
        })();
    </script>
</body>
</html>
